<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>국방 AI 어시스턴트 — KDSIS 실시간 검색</title>
  <style>
    :root {
      --primary:#2563EB;--primary-light:#3B82F6;--primary-dark:#1D4ED8;
      --green:#10B981;--green-dark:#059669;
      --bg:#F7F7F8;--surface:#FFF;--surface-alt:#F0F0F1;--surface-hover:#E8E8EA;
      --text:#1A1A2E;--muted:#6B7280;--inverse:#FFF;--border:#E5E7EB;
      --error:#EF4444;--warning:#F59E0B;
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
      --mono:"SF Mono","Consolas","Noto Sans KR",monospace;
      --r-sm:8px;--r-md:12px;--r-lg:16px;--r-full:9999px;
      --sh-sm:0 1px 2px rgba(0,0,0,.05);--sh-md:0 4px 12px rgba(0,0,0,.08);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px;-webkit-font-smoothing:antialiased}
    body{font-family:var(--font);font-size:.9375rem;color:var(--text);background:var(--bg);height:100vh;overflow:hidden;line-height:1.6}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:var(--r-full)}

    /* Layout */
    .app{display:flex;flex-direction:column;height:100vh}
    .header{display:flex;align-items:center;gap:1rem;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);min-height:56px}
    .header h1{font-size:1.0625rem;font-weight:600;flex:1}
    .status{font-size:.75rem;color:var(--green);font-weight:500}
    .status.busy{color:var(--warning)}

    .messages{flex:1;overflow-y:auto;padding:1.5rem 1rem;scroll-behavior:smooth}

    /* Messages */
    .msg{display:flex;gap:.75rem;max-width:800px;margin:0 auto 1.25rem;padding:0 .75rem;animation:fadeUp .3s ease-out}
    .msg--user{flex-direction:row-reverse}
    .msg--user .bubble{background:var(--primary);color:var(--inverse);border-radius:var(--r-lg) var(--r-lg) var(--r-sm) var(--r-lg);padding:.75rem 1rem;max-width:75%}
    .msg--user .bubble p{word-break:break-word}
    .msg--bot .bubble{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg) var(--r-lg) var(--r-lg) var(--r-sm);padding:1rem 1.25rem;max-width:85%;box-shadow:var(--sh-sm)}
    .avatar{width:36px;height:36px;border-radius:var(--r-full);background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.0625rem;flex-shrink:0}

    /* Typing */
    .dots{display:flex;gap:6px;align-items:center;height:20px}
    .dot{width:8px;height:8px;background:var(--muted);border-radius:var(--r-full);animation:bounce 1.4s infinite ease-in-out both}
    .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}

    /* Search status */
    .search-status{display:flex;align-items:center;gap:.5rem;font-size:.8125rem;color:var(--primary);margin-bottom:.75rem;font-weight:500}
    .search-status .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
    .search-params{display:flex;flex-wrap:wrap;gap:.375rem;margin-bottom:.75rem}
    .param-tag{font-size:.6875rem;padding:2px 8px;background:rgba(37,99,235,.08);color:var(--primary);border-radius:var(--r-full);font-weight:500}

    /* Result — card + table hybrid */
    .result-wrap{width:100%;margin:.75rem 0}
    .result-intro{font-size:.9375rem;margin-bottom:.75rem}
    .result-intro strong{color:var(--primary)}
    .result-toolbar{display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap}
    .chip{font-size:.75rem;padding:4px 10px;border-radius:var(--r-full);font-weight:500;background:var(--surface-alt);color:var(--text)}
    .chip-count{background:rgba(37,99,235,.1);color:var(--primary)}
    .view-toggle{margin-left:auto;font-size:.75rem;padding:4px 10px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);cursor:pointer;color:var(--muted);font-family:var(--font);transition:all .15s}
    .view-toggle:hover{background:var(--surface-alt);color:var(--text)}

    /* Cards */
    .cards{display:grid;gap:.75rem}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:.875rem 1rem;transition:all .15s}
    .card:hover{border-color:var(--primary-light);box-shadow:var(--sh-sm)}
    .card-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.375rem;flex-wrap:wrap}
    .spec-no{font-family:var(--mono);font-size:.8125rem;font-weight:600;color:var(--primary);background:rgba(37,99,235,.08);padding:2px 8px;border-radius:var(--r-sm)}
    .spec-kind{font-size:.6875rem;color:var(--muted);padding:2px 6px;background:var(--surface-alt);border-radius:var(--r-sm)}
    .status-badge{font-size:.6875rem;font-weight:600;padding:2px 8px;border-radius:var(--r-full);margin-left:auto}
    .status-active{background:rgba(16,185,129,.12);color:var(--green-dark)}
    .status-inactive{background:rgba(107,114,128,.12);color:var(--muted)}
    .status-transition{background:rgba(245,158,11,.12);color:var(--warning)}
    .status-abolished{background:rgba(239,68,68,.12);color:var(--error)}
    .card-title{font-size:.9375rem;font-weight:600;color:var(--text);margin-bottom:.5rem;line-height:1.4}
    .card-meta{display:flex;flex-wrap:wrap;gap:.375rem .875rem;font-size:.8125rem;color:var(--muted);margin-bottom:.375rem}
    .card-meta .mi{display:inline-flex;align-items:center;gap:.25rem}
    .card-meta .mi strong{color:var(--text);font-weight:500}
    .card-dates{font-size:.75rem;color:var(--muted);padding-top:.375rem;border-top:1px dashed var(--border);margin-top:.375rem}
    .card-dates span{margin-right:.875rem}
    .card-more{margin-top:.5rem}
    .card-more summary{font-size:.75rem;color:var(--primary);cursor:pointer;padding:.25rem 0;user-select:none;list-style:none;display:inline-flex;align-items:center;gap:.25rem}
    .card-more summary::-webkit-details-marker{display:none}
    .card-more summary::before{content:"▸";transition:transform .15s;display:inline-block}
    .card-more[open] summary::before{transform:rotate(90deg)}
    .card-more dl{display:grid;grid-template-columns:auto 1fr;gap:.375rem .75rem;margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--border);font-size:.75rem}
    .card-more dt{color:var(--muted);font-weight:500;white-space:nowrap}
    .card-more dd{color:var(--text);word-break:break-word}
    .card-more dd.empty{color:var(--border)}

    /* Compact table (fallback/toggle view) */
    .result-table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;font-size:.75rem;display:block;overflow-x:auto;max-width:100%}
    .result-table thead{background:var(--bg)}
    .result-table th{padding:.5rem .625rem;text-align:left;font-weight:600;font-size:.6875rem;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--border)}
    .result-table td{padding:.5rem .625rem;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
    .result-table tbody tr:last-child td{border-bottom:none}
    .result-table tbody tr:hover{background:rgba(37,99,235,.04)}
    .result-count{font-size:.75rem;color:var(--muted);margin-top:.5rem}
    .hidden{display:none !important}

    /* Spec mono */
    .mono{font-family:var(--mono);font-size:.75rem;color:var(--primary);font-weight:500}

    /* Empty / error */
    .empty-state{text-align:center;padding:1.5rem;color:var(--muted)}
    .empty-state-icon{font-size:2rem;margin-bottom:.75rem;opacity:.6}
    .error-msg{color:var(--error);font-size:.8125rem;padding:.5rem .75rem;background:rgba(239,68,68,.06);border-radius:var(--r-sm);border:1px solid rgba(239,68,68,.15)}

    /* Welcome */
    .welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:2rem;animation:fadeUp .5s ease-out}
    .welcome-icon{font-size:3.5rem;margin-bottom:1rem;animation:pulse 2s ease-in-out infinite}
    .welcome h3{font-size:1.5rem;font-weight:700;margin-bottom:.375rem;background:linear-gradient(135deg,var(--primary),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .welcome p{color:var(--muted);margin-bottom:1.5rem;max-width:480px}
    .welcome .badge{font-size:.6875rem;padding:4px 12px;background:rgba(16,185,129,.1);color:var(--green-dark);border-radius:var(--r-full);font-weight:600;margin-bottom:1rem}
    .prompts{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;width:100%;max-width:560px}
    .prompt-card{display:flex;align-items:center;gap:.5rem;padding:.75rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;font-family:var(--font);font-size:.8125rem;color:var(--text);text-align:left;transition:all .15s;box-shadow:var(--sh-sm)}
    .prompt-card:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--primary-light)}
    .prompt-card .pi{font-size:1.25rem;flex-shrink:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:var(--r-sm)}

    /* Input */
    .input-area{padding:.75rem 1.5rem 1.25rem;background:var(--bg);max-width:calc(800px + 4rem);width:100%;margin:0 auto}
    .input-form{display:flex;align-items:flex-end;gap:.5rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:.5rem .5rem .5rem 1rem;box-shadow:var(--sh-md);transition:border-color .15s,box-shadow .15s}
    .input-form:focus-within{border-color:var(--primary-light);box-shadow:var(--sh-md),0 0 0 3px rgba(37,99,235,.1)}
    .input-form textarea{flex:1;border:none;outline:none;resize:none;font-family:var(--font);font-size:.9375rem;color:var(--text);background:transparent;line-height:1.5;max-height:120px;padding:.375rem 0}
    .input-form textarea::placeholder{color:var(--muted)}
    .send-btn{flex-shrink:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--primary);border:none;border-radius:var(--r-sm);color:var(--inverse);cursor:pointer;font-size:1.0625rem;transition:all .15s}
    .send-btn:hover:not(:disabled){background:var(--primary-dark);transform:scale(1.05)}
    .send-btn:disabled{background:var(--border);cursor:not-allowed;opacity:.6}
    .hint{font-size:.75rem;color:var(--muted);text-align:center;margin-top:.375rem}

    /* Screenshot debug */
    .debug-toggle{font-size:.75rem;color:var(--muted);cursor:pointer;text-decoration:underline;margin-top:.5rem}
    .debug-img{max-width:100%;border:1px solid var(--border);border-radius:var(--r-sm);margin-top:.5rem;display:none}
    .debug-img.show{display:block}

    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media(max-width:640px){
      .prompts{grid-template-columns:1fr}
      .msg--user .bubble{max-width:85%}
      .msg--bot .bubble{max-width:95%}
      .input-area{padding:.5rem .75rem .75rem}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>🎖️ 국방 AI 어시스턴트 — KDSIS 실시간 검색</h1>
      <span class="status" id="status">● 온라인</span>
    </header>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🤖</div>
        <div class="badge">KDSIS 실시간 연동</div>
        <h3>무엇을 찾으시겠습니까?</h3>
        <p>자연어로 질문하면 KDSIS에서 규격, 부품, 기술자료를 자동으로 검색합니다. 데이터를 저장하지 않고 실시간 조회합니다.</p>
        <div class="prompts" id="prompts">
          <button class="prompt-card" data-q="K2 소총 관련 규격서 찾아줘"><span class="pi">🔍</span>K2 소총 관련 규격서 찾아줘</button>
          <button class="prompt-card" data-q="KDS 1005 규격번호 검색"><span class="pi">📋</span>KDS 1005 규격번호 검색</button>
          <button class="prompt-card" data-q="국방기술품질원 제정 활성 규격 조회"><span class="pi">🏛️</span>국방기술품질원 제정 활성 규격</button>
          <button class="prompt-card" data-q="박격포 적용장비 규격 검색"><span class="pi">📊</span>박격포 적용장비 규격 검색</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <form class="input-form" id="form">
        <textarea id="input" placeholder="검색할 내용을 입력하세요 (예: K2 소총 규격서 찾아줘)" rows="1" maxlength="500"></textarea>
        <button class="send-btn" type="submit" id="sendBtn" disabled>▲</button>
      </form>
      <p class="hint">Enter로 전송 · Shift+Enter로 줄바꿈 · KDSIS 실시간 조회 (데이터 미저장)</p>
    </div>
  </div>

<script>
const messages = document.getElementById("messages");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const statusEl = document.getElementById("status");
const welcome = document.getElementById("welcome");
let busy = false;

// ── Input handling ──
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
  sendBtn.disabled = input.value.trim().length === 0;
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.dispatchEvent(new Event("submit"));
  }
});

// ── Prompt cards ──
document.getElementById("prompts").addEventListener("click", (e) => {
  const card = e.target.closest(".prompt-card");
  if (card && !busy) sendQuery(card.dataset.q);
});

// ── Form submit ──
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  sendQuery(text);
});

// ── Main flow ──
async function sendQuery(text) {
  busy = true;
  welcome.style.display = "none";
  addMessage(text, "user");
  input.value = "";
  input.style.height = "auto";
  sendBtn.disabled = true;
  setStatus("KDSIS 검색 중…", true);

  // Typing + search status
  const typingId = addTyping();
  scrollBottom();

  try {
    const res = await fetch("/api/search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: text }),
    });

    // 응답이 JSON이 아닐 수 있으므로 먼저 텍스트로 받고 수동 파싱
    // (Render 타임아웃/에러 시 HTML 에러 페이지가 올 수 있음)
    const rawText = await res.text();
    let data;
    try {
      data = JSON.parse(rawText);
    } catch {
      removeTyping(typingId);
      const snippet = rawText.slice(0, 300).replace(/\s+/g, " ").trim();
      addBotMessage(
        `❌ 서버가 JSON이 아닌 응답을 반환했습니다 (HTTP ${res.status} ${res.statusText}).<br>` +
        `<div class="error-msg" style="margin-top:.5rem;font-family:var(--mono);font-size:.75rem;white-space:pre-wrap">${esc(snippet)}${rawText.length > 300 ? "…" : ""}</div>` +
        `<p style="margin-top:.5rem;font-size:.8125rem;color:var(--muted)">` +
        `원인 추정: Render 타임아웃 / 콜드 스타트 / 메모리 부족. ` +
        `터미널에서 <code>curl -v .../api/search/direct</code>로 재확인해 보세요.</p>`
      );
      setStatus("● 온라인", false);
      busy = false;
      scrollBottom();
      return;
    }
    removeTyping(typingId);

    if (data.type === "success" && data.rows && data.rows.length > 0) {
      addResultMessage(data);
    } else if (data.type === "error") {
      addBotMessage(`❌ ${data.message}`);
    } else {
      addBotMessage(`🔍 ${data.message || "검색 결과가 없습니다."}`);
    }
  } catch (err) {
    removeTyping(typingId);
    addBotMessage(`❌ 네트워크 에러: ${esc(err.message)}`);
  }

  setStatus("● 온라인", false);
  busy = false;
  scrollBottom();
}

// ── Message renderers ──
function addMessage(text, role) {
  const div = document.createElement("div");
  div.className = `msg msg--${role}`;
  if (role === "user") {
    div.innerHTML = `<div class="bubble"><p>${esc(text)}</p></div>`;
  }
  messages.appendChild(div);
  scrollBottom();
}

function addBotMessage(html) {
  const div = document.createElement("div");
  div.className = "msg msg--bot";
  div.innerHTML = `<div class="avatar">🤖</div><div class="bubble">${html}</div>`;
  messages.appendChild(div);
  scrollBottom();
}

// 상태 → 배지 클래스
function statusClass(s) {
  if (!s) return "";
  if (s.includes("활성")) return "status-active";
  if (s.includes("전환")) return "status-transition";
  if (s.includes("폐지")) return "status-abolished";
  return "status-inactive";
}

// 값이 비었는지
function isEmpty(v) { return v === undefined || v === null || String(v).trim() === ""; }

// 형상관리책임기관(1/2/3) → "상위 > 부서 > 담당" 하나로 합침
function mergeOrgHierarchy(row) {
  const parts = [row["형상관리책임기관(1)"], row["형상관리책임기관(2)"], row["형상관리책임기관(3)"]]
    .map((v) => (v || "").trim()).filter(Boolean);
  return parts.join(" › ");
}

// 주요 필드 (헤드라인/카드 상단)
const PRIMARY_FIELDS = new Set([
  "규격종류","규격번호","규격서명","상태","제정기관","적용장비명","부품관리번호",
  "제정일자","최종개정일자","품명","형상관리책임기관(1)","형상관리책임기관(2)","형상관리책임기관(3)",
]);

function addResultMessage(data) {
  const uid = "r" + Date.now() + Math.floor(Math.random() * 1000);
  let html = "";

  // 검색 파라미터 태그
  if (data.searchParams && Object.keys(data.searchParams).length > 0) {
    html += '<div class="search-params">';
    for (const [k, v] of Object.entries(data.searchParams)) {
      html += `<span class="param-tag">${esc(k)}: ${esc(v)}</span>`;
    }
    html += "</div>";
  }

  // 툴바 (카운트 + 뷰 토글)
  html += '<div class="result-toolbar">';
  html += `<span class="chip chip-count">🔍 총 <strong>${data.totalCount}</strong>건</span>`;
  html += `<span class="chip">${data.rows.length}건 표시</span>`;
  html += `<button class="view-toggle" onclick="toggleView('${uid}')">📊 표로 보기</button>`;
  html += "</div>";

  // 카드 뷰
  html += `<div class="cards" id="${uid}-cards">`;
  data.rows.forEach((row) => {
    const specNo = row["규격번호"] || "";
    const specKind = row["규격종류"] || "";
    const title = row["규격서명"] || row["품명"] || "(제목 없음)";
    const status = row["상태"] || "";
    const org = row["제정기관"] || "";
    const eqp = row["적용장비명"] || "";
    const part = row["부품관리번호"] || "";
    const nsn = row["재고번호(NSN)"] || "";
    const enactDate = row["제정일자"] || "";
    const revDate = row["최종개정일자"] || "";
    const orgHierarchy = mergeOrgHierarchy(row);

    html += '<div class="card">';
    html += '<div class="card-head">';
    if (specNo) html += `<span class="spec-no">${esc(specNo)}</span>`;
    if (specKind) html += `<span class="spec-kind">${esc(specKind)}</span>`;
    if (status) html += `<span class="status-badge ${statusClass(status)}">${esc(status)}</span>`;
    html += "</div>";

    html += `<div class="card-title">${esc(title)}</div>`;

    html += '<div class="card-meta">';
    if (org) html += `<span class="mi">🏛️ <strong>${esc(org)}</strong></span>`;
    if (eqp) html += `<span class="mi">⚙️ ${esc(eqp)}</span>`;
    if (part) html += `<span class="mi">📦 <span class="mono" style="font-size:.75rem">${esc(part)}</span></span>`;
    if (nsn) html += `<span class="mi">🔖 NSN ${esc(nsn)}</span>`;
    html += "</div>";

    if (!isEmpty(enactDate) || !isEmpty(revDate)) {
      html += '<div class="card-dates">';
      if (enactDate) html += `<span>📅 제정 <strong style="color:var(--text)">${esc(enactDate)}</strong></span>`;
      if (revDate) html += `<span>✏️ 최종개정 <strong style="color:var(--text)">${esc(revDate)}</strong></span>`;
      html += "</div>";
    }

    // 나머지 필드는 접힌 상세로
    const secondary = [];
    if (orgHierarchy) secondary.push(["형상관리책임기관", orgHierarchy]);
    data.columns.forEach((col) => {
      if (PRIMARY_FIELDS.has(col)) return;
      const v = row[col];
      if (isEmpty(v)) return;
      secondary.push([col, v]);
    });

    if (secondary.length > 0) {
      html += '<details class="card-more"><summary>자세히 보기</summary><dl>';
      secondary.forEach(([k, v]) => {
        html += `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`;
      });
      html += "</dl></details>";
    }

    html += "</div>";
  });
  html += "</div>";

  // 표 뷰 (숨김 상태)
  html += `<div class="result-wrap hidden" id="${uid}-table">`;
  html += '<table class="result-table"><thead><tr>';
  data.columns.forEach((col) => { html += `<th>${esc(col)}</th>`; });
  html += "</tr></thead><tbody>";
  data.rows.forEach((row) => {
    html += "<tr>";
    data.columns.forEach((col, idx) => {
      const val = row[col] || row[`col_${idx}`] || "";
      html += `<td title="${esc(val)}">${esc(val)}</td>`;
    });
    html += "</tr>";
  });
  html += "</tbody></table></div>";

  // 스크린샷
  html += `<span class="debug-toggle" onclick="toggleDebug(this)">📸 검색 화면 캡처 보기</span>`;
  html += `<img class="debug-img" src="/api/screenshot?t=${Date.now()}" alt="KDSIS 검색 캡처">`;

  addBotMessage(html);
}

function toggleView(uid) {
  const cards = document.getElementById(uid + "-cards");
  const table = document.getElementById(uid + "-table");
  if (!cards || !table) return;
  const showingCards = !cards.classList.contains("hidden");
  cards.classList.toggle("hidden", showingCards);
  table.classList.toggle("hidden", !showingCards);
  const btn = cards.parentElement.querySelector(".view-toggle");
  if (btn) btn.textContent = showingCards ? "🗂️ 카드로 보기" : "📊 표로 보기";
}

let typingCounter = 0;
function addTyping() {
  const id = "typing-" + ++typingCounter;
  const div = document.createElement("div");
  div.className = "msg msg--bot";
  div.id = id;
  div.innerHTML = `<div class="avatar">🤖</div><div class="bubble">
    <div class="search-status"><div class="spinner"></div>KDSIS에서 검색하고 있습니다…</div>
    <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>`;
  messages.appendChild(div);
  return id;
}

function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

// ── Utils ──
function toggleDebug(el) {
  const img = el.nextElementSibling;
  img.classList.toggle("show");
}

function setStatus(text, isBusy) {
  statusEl.textContent = text;
  statusEl.className = "status" + (isBusy ? " busy" : "");
}

function scrollBottom() {
  requestAnimationFrame(() => {
    messages.scrollTop = messages.scrollHeight;
  });
}

function esc(str) {
  if (!str) return "";
  const d = document.createElement("div");
  d.appendChild(document.createTextNode(String(str)));
  return d.innerHTML;
}
</script>
</body>
</html>
